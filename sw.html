
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="./sw.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <p>
                <span class="mins">00</span>:<span class="seconds">00</span>:<span class="tens">00</span>
            </p> <br>
            <button class="timerBtn"  id="btn-start">Start</button>
            <button class="timerBtn"  id="btn-stop">Stop</button>
            <button class="timerBtn"  id="btn-reset">Reset</button>
        </div>
    </div>


    <script src="./sw.js"></script>
</body>
</html>
